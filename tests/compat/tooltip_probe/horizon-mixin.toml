# A test-only bundle, never shipped: another mod's HEAD hook on the tooltip
# hook point ShulkerPeek answers, at an ordinary priority. tools/test_combined.py
# checks it runs before ShulkerPeek's (so a component it sets is kept) and
# that the game builds with both and Horizon's official native mods.
[mod]
id = "tooltip_probe"
version = "0.0.0"
priority = 100

[compatibility]
horizon_revision = "f319701e8c9ab657ff562250b3ba07b2d654e3bc"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "tooltip_probe"
source = "runtime.rs"

[[injection]]
id = "seen"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tooltip_component"
helper = "seen.rs"
bindings = [{ name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" }]
