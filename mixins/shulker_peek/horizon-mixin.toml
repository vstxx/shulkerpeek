[mod]
id = "shulker_peek"
version = "0.1.1"
priority = 100

# The commit it was tested on: Horizon Nightly 2026-11-05 (tag
# nightly-source/2026-11-05-f319701). It hooks only native hook points
# (`hooks` in compatibility.json), so the launcher builds it on any Horizon
# that has them.
[compatibility]
horizon_revision = "f319701e8c9ab657ff562250b3ba07b2d654e3bc"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "shulker_peek"
source = "runtime.rs"

# The game-side half of the mod: whether a stack's tooltip shows the grid,
# asked by both tooltip hooks so they always agree.
[[module]]
id = "peek"
file = "crates/horizon-client/src/game.rs"
name = "shulker_peek_game"
source = "peek.rs"

# Horizon's tooltip hook points (`tooltip_component` and
# `tooltip_component_draw`): Horizon lays the tooltip out with room for the
# grid under its lines, draws the box and the lines, then asks the mod to draw
# the grid there. ShulkerPeek asks last (lowest priority) and keeps any other
# mod's component.
[[injection]]
id = "component"
kind = "HEAD"
priority = -1000
target = "horizon_client::game::native_hooks::Game<'_>::native_tooltip_component"
helper = "component.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "size", ty = "&mut Option<[f32; 2]>", value = "&mut *size" },
]

[[injection]]
id = "draw"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tooltip_component_draw"
helper = "draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "origin", ty = "[f32; 2]", value = "origin" },
  { name = "size", ty = "[f32; 2]", value = "size" },
]

# The input hook point `key`: Shift for the "while holding Shift" setting.
[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
