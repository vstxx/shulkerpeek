id = "shulker_peek"
kind = "mod"
name = "ShulkerPeek"
summary = "A shulker box's contents as a 9 x 3 grid in its tooltip."
description = """
Hover a shulker box to see what's inside: its 27 slots appear as a 9 x 3 grid right in the tooltip, laid out like the box's own screen, with item models, stack counts and durability bars.

- Works with the plain shulker box and all 16 dyed ones.
- No key needed: the grid shows on hover. A setting can limit it to while Shift is held.
- The grid sits under the name; the tooltip's other lines (item counts, lore) stay below it.
- Respects `minecraft:tooltip_display`: a hidden tooltip, or a hidden `minecraft:container`, shows no grid.
- Settings in Options > Mods > ShulkerPeek > Config: on or off, always or with Shift, a grid for empty boxes, and slots tinted with the box's dye.

Since 0.2.0 it is a sandboxed WebAssembly mod, so there is nothing to build. It is client-side, never changes items, inventories or worlds, and sends nothing to a server. A box's contents show where the server sends them, as Horizon and vanilla servers do.

Built with the SDK of Nightly 2026-11-21 (`f037744`) and tested in game on Nightly 2026-11-22 (`2b77287`).

By vstxx. The WebAssembly port is by [MolaxOffi](https://github.com/MolaxOffi/ShulkerPeek-Extended) (MIT), published here with fixes."""
authors = ["vstxx", "MolaxOffi (WebAssembly port)"]
owners = ["vstxx"]
owner_ids = [106024432]
license = "MIT"
source = "https://github.com/vstxx/shulkerpeek"
icon = "icons/shulker_peek.png"
categories = ["storage", "utility"]
tags = ["shulker-box", "tooltip", "inventory", "preview"]
screenshots = ["screenshots/shulker_peek/1.png", "screenshots/shulker_peek/2.png"]

